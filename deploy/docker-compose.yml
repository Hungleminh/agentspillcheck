services:
  spillcheck-init:
    image: golang:1.26-alpine
    user: "0:0"
    volumes:
      - spillcheck-data:/data
    command: ["chown", "-R", "65532:65532", "/data"]
  spillcheck:
    depends_on:
      spillcheck-init:
        condition: service_completed_successfully
    image: ghcr.io/hungleminh/agentspillcheck:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      SPILLCHECK_LOCALE: "${SPILLCHECK_LOCALE:-vi}"
      SPILLCHECK_BIND: "0.0.0.0"
      SPILLCHECK_PUBLIC: "false"
      HOME: /data
    ports:
      - "127.0.0.1:7700-7709:7700-7709"
    volumes:
      - spillcheck-data:/data
volumes:
  spillcheck-data:
