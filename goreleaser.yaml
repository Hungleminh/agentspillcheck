version: 2
project_name: agentspillcheck
builds:
  - main: ./cmd/spillcheck
    binary: spillcheck
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
release:
  github:
    owner: Hungleminh
    name: agentspillcheck
